paths:
    - Configuration/TSconfig
    - static
filePatterns:
    - "*.typoscript"
    - "*.tsconfig"
    - "*.txt"
sniffs:
    - class: Indentation
      parameters:
          useSpaces: true
          indentPerLevel: 4
          indentConditions: true
    - class: DeadCode
    - class: OperatorWhitespace
    - class: DuplicateAssignment
    - class: EmptySection
    - class: ConfigNoCache
    - class: NestingConsistency
    - class: RepeatingRValue
